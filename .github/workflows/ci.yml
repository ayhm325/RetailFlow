name: RetailFlow CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, SQL Integration & Playwright E2E
    runs-on: ubuntu-24.04

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ephemeral SQL Server container
        run: |
          PW="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)Aa1!"
          echo "::add-mask::$PW"

          docker run -d \
            --name retailflow-sql \
            -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$PW" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          CONN_PROD="Server=localhost,1433;Database=RetailFlowProduct;User Id=sa;Password=${PW};Encrypt=True;TrustServerCertificate=True"
          CONN_SPIKE="Server=localhost,1433;Database=RetailFlowIdentitySpike;User Id=sa;Password=${PW};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
          echo "::add-mask::$CONN_PROD"
          echo "::add-mask::$CONN_SPIKE"
          echo "RETAILFLOW_CONNECTION=$CONN_PROD" >> "$GITHUB_ENV"
          echo "ConnectionStrings__RetailFlow=$CONN_PROD" >> "$GITHUB_ENV"
          echo "RETAILFLOW_IDENTITY_SPIKE_CONNECTION=$CONN_SPIKE" >> "$GITHUB_ENV"

          for i in $(seq 1 24); do
            if docker exec retailflow-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PW" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server failed to become ready."
          exit 1

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET local tools
        run: dotnet tool restore --tool-manifest experiments/IdentitySpike/dotnet-tools.json

      - name: Build RetailFlow Product Host (Release)
        run: dotnet build RetailFlow.slnx --configuration Release

      - name: Build IdentitySpike (Release)
        run: dotnet build experiments/IdentitySpike/RetailFlow.IdentitySpike.slnx --configuration Release

      - name: Build SessionTransportSpike (Release)
        run: dotnet build experiments/SessionTransportSpike/RetailFlow.SessionTransportSpike.slnx --configuration Release

      - name: Build SessionTransportSpike Playwright (Release)
        run: dotnet build experiments/SessionTransportSpike/RetailFlow.SessionTransportSpike.Playwright.slnx --configuration Release

      - name: Apply EF Core migrations to SQL Server
        working-directory: experiments/IdentitySpike
        env:
          ConnectionStrings__IdentitySpike: ${{ env.RETAILFLOW_IDENTITY_SPIKE_CONNECTION }}
        run: |
          dotnet tool run dotnet-ef database update \
            --project src/RetailFlow.IdentitySpike.Api \
            --startup-project src/RetailFlow.IdentitySpike.Api \
            --configuration Release \
            --no-build \
            --connection "$RETAILFLOW_IDENTITY_SPIKE_CONNECTION"

          dotnet tool run dotnet-ef database update \
            --project ../SessionTransportSpike/src/RetailFlow.SessionTransportSpike.Api \
            --startup-project ../SessionTransportSpike/src/RetailFlow.SessionTransportSpike.Api \
            --configuration Release \
            --no-build \
            --context SessionTicketDbContext \
            --connection "$RETAILFLOW_IDENTITY_SPIKE_CONNECTION"

          dotnet tool run dotnet-ef database update \
            --project ../../src/RetailFlow.Infrastructure \
            --startup-project ../../src/RetailFlow.Api \
            --configuration Release \
            --no-build \
            --context RetailFlowDbContext \
            --connection "$RETAILFLOW_CONNECTION"

      - name: Install Playwright Chromium and OS dependencies
        run: pwsh experiments/SessionTransportSpike/tests/RetailFlow.SessionTransportSpike.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run RetailFlow Product Host Unit & Integration Tests (Release)
        run: |
          dotnet test RetailFlow.slnx \
            --configuration Release \
            --no-build \
            --results-directory TestResults/ProductHost \
            --logger "trx" \
            --logger "console;verbosity=normal"

      - name: Run IdentitySpike Unit & SQL Integration Tests (Release)
        run: |
          dotnet test experiments/IdentitySpike/RetailFlow.IdentitySpike.slnx \
            --configuration Release \
            --no-build \
            --results-directory TestResults/IdentitySpike \
            --logger "trx" \
            --logger "console;verbosity=normal"

      - name: Run SessionTransportSpike Unit & SQL Integration Tests (Release)
        run: |
          dotnet test experiments/SessionTransportSpike/RetailFlow.SessionTransportSpike.slnx \
            --configuration Release \
            --no-build \
            --results-directory TestResults/SessionTransportSpike \
            --logger "trx" \
            --logger "console;verbosity=normal"

      - name: Run SessionTransportSpike Playwright Browser Tests (Release)
        run: |
          dotnet test experiments/SessionTransportSpike/RetailFlow.SessionTransportSpike.Playwright.slnx \
            --configuration Release \
            --no-build \
            --results-directory TestResults/Playwright \
            --logger "trx" \
            --logger "console;verbosity=normal"

      - name: Upload test reports and Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-diagnostics
          if-no-files-found: warn
          path: |
            TestResults/**/*.trx
            TestResults/**/In/**
            experiments/SessionTransportSpike/tests/RetailFlow.SessionTransportSpike.PlaywrightTests/bin/Release/net10.0/test-artifacts/**

      - name: Stop ephemeral SQL Server container
        if: always()
        run: docker rm -f retailflow-sql || true
